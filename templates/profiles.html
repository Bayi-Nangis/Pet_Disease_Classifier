<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
  <title>Pet Profiles Dashboard</title>
</head>
<body>

<div class="box">
  <div class="box2">
      <a href="/" style="float: left;">← Back to Analyzer</a>
      <br><br>
      
      <h2>Create a New Pet Profile</h2>
      <input type="text" id="petNameInput" placeholder="Enter Pet Name...">
      <button id="createProfileBtn">Save Profile</button>
      
      <hr style="margin: 20px 0;">

      <h2>Select a Profile to View History</h2>
      <select id="profileSelect">
          <option value="">-- Choose a Pet --</option>
      </select>

      <div id="historySection" style="margin-top: 20px;">
          <h3>Medical Diagnostic Log</h3>
          <div id="historyLog">Select a pet from the list to look up their past medical logs.</div>
      </div>
  </div>
</div>

<script src="{{url_for('static', filename='profiles.js')}}"></script>
</body>
</html>
